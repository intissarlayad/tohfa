<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>TOHFA | Inscription</title>
  <link rel="icon" type="image/jpeg" href="{{ url_for('static', filename='images/logo_tohfa.jpeg') }}"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"/>
</head>
<body>

<div class="flash-container">
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}
      <div class="flash flash-{{ category }}">
        <i class="fa-solid fa-info-circle"></i> {{ message }}
        <button class="flash-close" onclick="this.parentElement.remove()">×</button>
      </div>
    {% endfor %}
  {% endwith %}
</div>

<button class="theme-btn" id="themeToggle" style="position:fixed;top:1.2rem;right:1.2rem;z-index:999;">
  <i class="fa-solid fa-moon" id="themeIcon"></i>
</button>

<div class="auth-page">
  <div class="auth-card" data-aos="fade-up" style="max-width:520px;">
    <div class="auth-logo">
      <img src="{{ url_for('static', filename='images/logo_tohfa.jpeg') }}" alt="TOHFA"/>
      <h1>TOHFA</h1>
      <p>Rejoignez notre communauté</p>
    </div>

    <h2 class="auth-title">Créer un compte</h2>

    <!-- Role selector -->
    <div class="role-tabs" id="roleTabs">
      <button type="button" class="role-tab active" data-role="client" onclick="switchRole('client')">
        <i class="fa-solid fa-user"></i> Je suis Client
      </button>
      <button type="button" class="role-tab" data-role="designer" onclick="switchRole('designer')">
        <i class="fa-solid fa-palette"></i> Je suis Designer
      </button>
    </div>

    <form method="POST">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
      <input type="hidden" name="role" id="roleInput" value="client"/>

      <div class="form-group">
        <label class="form-label">Nom complet</label>
        <input class="form-input" type="text" name="name" placeholder="Votre nom" required/>
      </div>
      <div class="form-group">
        <label class="form-label">Email</label>
        <input class="form-input" type="email" name="email" placeholder="votre@email.com" required/>
      </div>
      <div class="form-group">
        <label class="form-label">Téléphone</label>
        <input class="form-input" type="tel" name="phone" placeholder="+212 6XX XXX XXX" required/>
      </div>
      <div class="form-group">
        <label class="form-label">Mot de passe</label>
        <input class="form-input" type="password" name="password" placeholder="••••••••" required minlength="6"/>
      </div>

      <!-- Designer-only fields -->
      <div class="designer-fields" id="designerFields">
        <div class="form-group">
          <label class="form-label">Bio / Spécialité</label>
          <textarea class="form-input" name="bio" placeholder="Décrivez votre style, vos spécialités..."></textarea>
        </div>
        <div class="form-group">
          <label class="form-label">Votre marge (%)</label>
          <input class="form-input" type="number" name="margin_pct" value="15" min="5" max="50" step="1"
                 placeholder="Ex: 15"/>
          <small style="color:var(--text-muted);font-size:.78rem;">Commission sur chaque design sélectionné par un client.</small>
        </div>
      </div>

      <button type="submit" class="form-submit" id="submitBtn">
        <i class="fa-solid fa-user-plus"></i> Créer mon compte Client
      </button>
    </form>

    <div class="form-link">
      Déjà inscrit ? <a href="{{ url_for('login') }}">Se connecter</a>
    </div>
  </div>
</div>

<script>
  // Theme
  const html = document.documentElement;
  const saved = localStorage.getItem('tohfa-theme') || 'light';
  html.setAttribute('data-theme', saved);
  document.getElementById('themeIcon').className = saved === 'dark' ? 'fa-solid fa-sun' : 'fa-solid fa-moon';
  document.getElementById('themeToggle').addEventListener('click', () => {
    const next = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    html.setAttribute('data-theme', next);
    localStorage.setItem('tohfa-theme', next);
    document.getElementById('themeIcon').className = next === 'dark' ? 'fa-solid fa-sun' : 'fa-solid fa-moon';
  });

  // Role switch
  function switchRole(role) {
    document.getElementById('roleInput').value = role;
    document.querySelectorAll('.role-tab').forEach(t => t.classList.toggle('active', t.dataset.role === role));
    const df = document.getElementById('designerFields');
    const btn = document.getElementById('submitBtn');
    if (role === 'designer') {
      df.classList.add('show');
      btn.innerHTML = '<i class="fa-solid fa-palette"></i> Créer mon compte Designer';
    } else {
      df.classList.remove('show');
      btn.innerHTML = '<i class="fa-solid fa-user-plus"></i> Créer mon compte Client';
    }
  }
</script>
</body>
</html>
